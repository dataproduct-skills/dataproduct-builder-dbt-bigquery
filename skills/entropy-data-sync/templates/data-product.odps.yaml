apiVersion: "v1.0.0"
kind: "DataProduct"
id: "{{DATA_PRODUCT_ID}}"
name: "{{DATA_PRODUCT_NAME}}"
status: "draft"
description:
  purpose: "{{PURPOSE}}"
team:
  name: "{{TEAM_NAME}}"
tags:
  - "{{TAG}}"
outputPorts:
  - name: "{{OUTPUT_PORT_NAME}}"
    version: "1"
    type: "bigquery"
    contractId: "{{CONTRACT_ID}}"
    customProperties:
      - property: "project"
        value: "{{PROJECT}}"
      - property: "dataset"
        value: "{{DATASET}}"
      - property: "table"
        value: "{{TABLE}}"
      - property: "contractServer"
        value: "production"
      - property: "displayName"
        value: "{{TABLE}}"
      - property: "status"
        value: "draft"
      - property: "environment"
        value: "prod"
customProperties:
  - property: "icon"
    value: "bigquery"
  - property: "type"
    value: "consumer-aligned"
  - property: "visibility"
    value: "internal"
  - property: "dataProductBuilder"
    value: "https://github.com/dataproduct-skills/dataproduct-builder-dbt-bigquery"
