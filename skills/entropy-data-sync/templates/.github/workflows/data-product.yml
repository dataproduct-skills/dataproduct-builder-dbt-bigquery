name: "{{DATA_PRODUCT_NAME}} Data Product"
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

env:
  API: {{API_HOST}}/api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          # Service account key stored as a repository secret. For keyless auth,
          # replace with workload_identity_provider + service_account.
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: astral-sh/setup-uv@v6

      - name: Sync Python deps
        # Installs the dbt adapter, openlineage-dbt, datacontract-cli[all],
        # entropy-data (and other dev deps) into the project's .venv at the
        # versions pinned by uv.lock. All `uv run …` invocations below use
        # this venv.
        run: uv sync

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          {{DBT_PROFILE}}:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account
                keyfile: ${{ steps.gcp.outputs.credentials_file_path }}
                project: {{PROJECT}}
                dataset: {{DATASET}}
                location: {{LOCATION}}
                threads: 4
          EOF

      - name: dbt deps
        run: uv run dbt deps

      - name: dbt run
        run: uv run dbt-ol run --target prod
        env:
          OPENLINEAGE__TRANSPORT__AUTH__APIKEY: ${{ secrets.ENTROPY_DATA_API_KEY }}

      - name: dbt test
        run: uv run dbt test --target prod

      - name: Publish data product
        run: uv run entropy-data dataproducts put {{DATA_PRODUCT_ID}} --file {{ODPS_FILE}}
        env:
          ENTROPY_DATA_API_KEY: ${{ secrets.ENTROPY_DATA_API_KEY }}

      - name: Publish data contract
        run: uv run entropy-data datacontracts put {{CONTRACT_ID}} --file models/output_ports/v1/{{CONTRACT_FILE}}
        env:
          ENTROPY_DATA_API_KEY: ${{ secrets.ENTROPY_DATA_API_KEY }}

      - name: Data contract test
        run: |
          uv run datacontract test models/output_ports/v1/{{CONTRACT_FILE}} \
            --server production \
            --publish $API/test-results
        env:
          ENTROPY_DATA_API_KEY: ${{ secrets.ENTROPY_DATA_API_KEY }}
          DATACONTRACT_BIGQUERY_ACCOUNT_INFO_JSON_PATH: ${{ steps.gcp.outputs.credentials_file_path }}
